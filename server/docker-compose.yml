# Игровой сервер: слушает только 127.0.0.1:3001 (наружу — через Caddy, /arena-ws).
services:
  arena:
    build:
      context: ..
      dockerfile: server/Dockerfile
    image: vsadniki-arena-server
    container_name: arena-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "2" }
